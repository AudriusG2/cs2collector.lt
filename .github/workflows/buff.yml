name: Buff.market kainų atnaujinimas

# Buff griežtai riboja greitį, todėl surinkimas ilgas ir vyksta atskirai nuo
# kasdienio Steam kainų atnaujinimo. Rezultatas sujungiamas su esamu
# data/buff.json, tad net nepilnas paleidimas bazę tik papildo.

on:
  schedule:
    - cron: "40 1 * * *" # kasdien 01:40 UTC
  workflow_dispatch:
    inputs:
      start:
        description: "Nuo kurio puslapio pradėti"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: buff-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Surinkti Buff.market kainas
        run: node scripts/scrape-buff.mjs --start ${{ inputs.start || '1' }}
        timeout-minutes: 320
        continue-on-error: true

      - name: Įrašyti pokyčius
        run: |
          git config user.name "cs2collector-bot"
          git config user.email "bot@cs2collector.lt"
          git add data/buff.json
          if git diff --staged --quiet; then
            echo "Pokyčių nėra"
          else
            git commit -m "data: Buff kainos $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
